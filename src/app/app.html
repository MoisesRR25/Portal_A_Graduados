<!-- Barra de Navegación Superior -->
<header class="navbar">
  <div class="nav-container">
    <a routerLink="/" class="brand">
      <span class="badge-ues">UES</span>
      <div class="brand-text">
        <strong>Portal de Graduados</strong>
        <small>Ingeniería de Sistemas Informáticos</small>
      </div>
    </a>

    <!-- Botón menú móvil -->
    <button class="menu-toggle" (click)="menuAbierto = !menuAbierto" aria-label="Abrir menú">
      ☰
    </button>

    <!-- Enlaces de navegación -->
    <nav class="nav-links" [class.active]="menuAbierto" (click)="menuAbierto = false">
      <a routerLink="/" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}">Inicio</a>
      <a routerLink="/bolsa-trabajo" routerLinkActive="active-link">Bolsa de trabajo</a>
      <a routerLink="/login" class="btn-outline">Iniciar sesión</a>
    </nav>
  </div>
</header>

<!-- Contenedor dinámico donde cambian tus páginas -->
<main class="main-content">
  <router-outlet></router-outlet>
</main>
